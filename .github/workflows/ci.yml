# GitHub Actions Continuous Integration (CI) Workflow for Habbito
# Validates code syntax, composer dependencies, and configuration on every Pull Request (PR)
# and merge into main.
name: CI & PR Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: PHP Syntax, Dependencies & Framework Sanity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, curl, zip, gd, fileinfo
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-all --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.2-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev --optimize-autoloader

      - name: Check PHP Syntax (Linting)
        run: |
          echo "Linting PHP files for syntax errors..."
          find app platform config routes -name "*.php" -print0 | xargs -0 -n 1 -P 4 php -l > /dev/null
          echo "All PHP files passed syntax checks!"

      - name: Verify Environment Configuration Template
        run: |
          if [ ! -f .env.example ]; then
            echo "Error: .env.example is missing!"
            exit 1
          fi
          echo ".env.example is present and verified."
